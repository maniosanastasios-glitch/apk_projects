name: Build Kivy Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: repo-root
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies for Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            build-essential libltdl-dev python3-venv

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade "pip==24.3.1" "setuptools<75" wheel
          python -m pip install buildozer cython==0.29.36

      - name: Cache Buildozer build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            repo-root/.buildozer
          key: buildozer-v6-pip2431-${{ runner.os }}-${{ hashFiles('repo-root/buildozer.spec') }}

      - name: Repair pip inside any existing p4a venvs
        run: |
          python -m pip install --upgrade "pip==24.3.1" "setuptools<75" wheel
          for py in .buildozer/**/venv/bin/python "$HOME/.buildozer"/**/venv/bin/python; do
            if [ -x "$py" ]; then
              echo "Repairing pip in $py"
              "$py" -m pip install --force-reinstall "pip==24.3.1" "setuptools<75" wheel || true
            fi
          done

      - name: Build Android debug APK
        run: |
          buildozer android debug || {
            echo "p4a venv hit pip error; reinstalling pip==24.3.1 inside venvs and retrying..."
            for py in .buildozer/**/venv/bin/python "$HOME/.buildozer"/**/venv/bin/python; do
              if [ -x "$py" ]; then
                echo "Repairing pip in $py"
                "$py" -m pip install --force-reinstall "pip==24.3.1" "setuptools<75" wheel || true
              fi
            done
            buildozer android debug
          }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: testpopup-debug-apk
          path: repo-root/bin/*.apk
