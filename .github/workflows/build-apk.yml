name: Build Kivy Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: repo-root
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies for Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            build-essential libltdl-dev python3-venv

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade "pip==24.3.1" "setuptools<75" wheel
          python -m pip install buildozer cython==0.29.36

      - name: Cache Buildozer downloads (SDK/NDK only, not venvs)
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer/android/platform
          key: buildozer-v7-${{ runner.os }}-${{ hashFiles('repo-root/buildozer.spec') }}

      - name: Remove any stale p4a venvs
        run: |
          rm -rf .buildozer/android/platform/build-*/ \
                 .buildozer/android/platform/python-for-android/venv \
                 "$HOME/.buildozer/android/platform/python-for-android/venv" || true
          find .buildozer "$HOME/.buildozer" -type d -name venv -prune -exec rm -rf {} + 2>/dev/null || true

      - name: Build Android debug APK
        run: buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: testpopup-debug-apk
          path: repo-root/bin/*.apk
